spring.application.name=limbus-admin-api
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/limbus?createDatabaseIfNotExist=true&sslMode=${DB_SSL}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:kaicius}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:limbus}

spring.datasource.hikari.maximum-pool-size=3

cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
